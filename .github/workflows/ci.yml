# Integración Continua de MultiServ (Calidad de Software).
# Corre lint, chequeo de tipos, pruebas y build en cada push o PR a develop/main.
# No usa ningún secreto real: todas las variables de entorno son ficticias.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (NestJS + Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Valores ficticios. prisma7.config.ts usa env('DIRECT_URL'), que lanza error
      # si la variable no existe, aunque `prisma generate` no se conecte a la base.
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      # PrismaService la lee; en las pruebas está simulado y nunca se conecta.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # auth.module.ts lanza error si falta. No es un secreto real.
      JWT_SECRET: solo-para-ci-no-es-secreto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma (sin base de datos)
        run: npx --no-install prisma generate --config prisma7.config.ts

      - name: Lint (oxlint)
        run: npm run lint

      - name: Chequeo de tipos
        run: npx --no-install tsc --noEmit

      - name: Pruebas unitarias
        run: npm test

      - name: Pruebas e2e (PrismaService simulado)
        run: npm run test:e2e

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Tiene valor por defecto en src/lib/backend.ts; se deja explícito como documentación.
      API_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      # next-env.d.ts está en .gitignore; typegen lo genera (junto con los tipos
      # de rutas en .next/types) sin hacer un build completo, para que tsc lo encuentre.
      - name: Generar tipos de Next.js
        run: npx --no-install next typegen

      - name: Chequeo de tipos
        run: npx --no-install tsc --noEmit

      - name: Pruebas (Vitest + RTL)
        run: npm test

      - name: Build de producción
        run: npm run build
